# JVM memory for the Gradle build (run on CI, not locally)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX required for all AndroidX dependencies
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Cap the worker pool at 2 (CI runners default to one worker per core, i.e.
# 4). Artifact transforms run in this pool and their dependency downloads ride
# along with them; fewer concurrent downloads lowers the chance of Maven
# Central replying HTTP 429 "Too Many Requests" to a parallel burst from a
# shared GitHub Actions egress IP. Builds are marginally slower to parallelise
# as a trade-off; the project is a single-module app so the cost is small.
org.gradle.workers.max=2
